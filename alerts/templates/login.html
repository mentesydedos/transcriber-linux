{% extends 'base.html' %}
{% block title %}Iniciar sesión — Monitoreo ITESO{% endblock %}
{% block content %}
<div class="row justify-content-center" style="margin-top:6vh">
  <div class="col-sm-9 col-md-6 col-lg-4">

    <div class="text-center mb-4">
      <img src="/static/logo_iteso.jpg" height="90" style="border-radius:8px;margin-bottom:.75rem">
      <h1 style="font-size:1.5rem;font-weight:800">Monitoreo ITESO</h1>
      <p style="color:var(--text2);font-size:.875rem">Sistema de monitoreo de transcripciones</p>
    </div>

    <div class="card p-4">
      <h5 class="mb-4 fw-bold">Iniciar sesión</h5>
      <form method="post" autocomplete="on">
        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" name="email" class="form-control" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label">Contraseña</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
        </button>
      </form>
    </div>

    <p class="text-center mt-3" style="font-size:.875rem;color:var(--text2)">
      ¿No tienes cuenta? <a href="/register">Regístrate</a>
    </p>

  </div>
</div>
{% endblock %}
