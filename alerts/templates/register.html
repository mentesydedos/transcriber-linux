{% extends 'base.html' %}
{% block title %}Registro — Monitoreo ITESO{% endblock %}
{% block content %}
<div class="row justify-content-center" style="margin-top:4vh">
  <div class="col-sm-9 col-md-6 col-lg-4">

    <div class="text-center mb-4">
      <img src="/static/logo_iteso.jpg" height="80" style="border-radius:8px;margin-bottom:.75rem">
      <h1 style="font-size:1.5rem;font-weight:800">Monitoreo ITESO</h1>
    </div>

    <div class="card p-4">
      <h5 class="mb-4 fw-bold">Crear cuenta</h5>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Nombre completo</label>
          <input type="text" name="name" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña <span style="color:var(--muted)">(mín. 6 caracteres)</span></label>
          <input type="password" name="password" class="form-control" required minlength="6">
        </div>
        <div class="mb-4">
          <label class="form-label">Confirmar contraseña</label>
          <input type="password" name="confirm" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="bi bi-person-plus me-1"></i>Crear cuenta
        </button>
      </form>
    </div>

    <p class="text-center mt-3" style="font-size:.875rem;color:var(--text2)">
      ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
    </p>
    <p class="text-center" style="font-size:.8rem;color:var(--muted)">
      <i class="bi bi-info-circle me-1"></i>El primer usuario registrado obtiene rol de administrador.
    </p>
    <p class="text-center" style="font-size:.75rem;color:var(--muted)">
      ITESO, Universidad Jesuita de Guadalajara
    </p>

  </div>
</div>
{% endblock %}
